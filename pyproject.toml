[project]
name = "pgmate"
version = "0.1.0"
description = "PostgreSQL query generation CLI tool with conversational agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
    "strands>=0.1.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "click>=8.1.0",
]

[project.scripts]
pgmate = "pgmate.main:cli"
