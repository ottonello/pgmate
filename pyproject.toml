[project]
name = "pgmate"
version = "0.1.0"
description = "PostgreSQL query generation CLI tool with conversational agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
    "strands-agents[openai,anthropic]>=1.0.0",
    "strands-agents-tools>=0.2.0",
    "click>=8.1.0",
]

[project.scripts]
pgmate = "pgmate.main:cli"
